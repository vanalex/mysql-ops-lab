# Copy to k8s/10-secrets.yaml (git-ignored) and change every value.
# The S3 keys must match the identities in seaweedfs-s3-config below.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-lab-secrets
  namespace: mysql-lab
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change-me-root
  REPL_PASSWORD: change-me-repl          # user: repl            (native replication)
  WRITER_PASSWORD: change-me-writer      # user: labwriter       (Redpanda Connect)
  BACKUP_PASSWORD: change-me-backup      # user: backup          (snapshot CronJob)
  BINLOG_PASSWORD: change-me-binlog      # user: binlog_archiver (binlog streaming)
  AWS_ACCESS_KEY_ID: labaccesskey
  AWS_SECRET_ACCESS_KEY: labsecretkey-change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  namespace: mysql-lab
type: Opaque
stringData:
  s3.json: |
    {
      "identities": [
        {
          "name": "lab",
          "credentials": [
            { "accessKey": "labaccesskey", "secretKey": "labsecretkey-change-me" }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
