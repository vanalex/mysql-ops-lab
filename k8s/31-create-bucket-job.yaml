apiVersion: batch/v1
kind: Job
metadata:
  name: create-bucket
  namespace: mysql-lab
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws
          image: amazon/aws-cli:latest        # TODO: pin
          envFrom:
            - secretRef: { name: mysql-lab-secrets }
          env:
            - { name: AWS_REGION, value: us-east-1 }
          command: ["sh", "-c"]
          args:
            - |
              set -e
              until aws --endpoint-url http://seaweedfs:8333 s3 ls >/dev/null 2>&1; do
                echo "waiting for seaweedfs..."; sleep 3
              done
              aws --endpoint-url http://seaweedfs:8333 s3 mb s3://mysql-backups || true
              aws --endpoint-url http://seaweedfs:8333 s3 ls
